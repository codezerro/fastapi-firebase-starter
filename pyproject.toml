[project]
name = "fastapi-firebase-starter"
version = "0.1.0"
description = "FastAPI boilerplate with Firebase Authentication and Firestore for Google Cloud Run"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "firebase-admin>=7.1,<8.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "ruff>=0.16.4",
  "asyncio>=4.0.0",
  "semgrep>=1.174.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
